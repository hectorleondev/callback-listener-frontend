name: Next.js CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
    
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    
    # Uncomment when you add tests to your project
    # - name: Test
    #   run: npm test
    
    - name: Docker build test
      run: |
        chmod +x ./test-docker.sh
        ./test-docker.sh
